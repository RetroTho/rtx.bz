<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="description" content="Make a long URL a little easier to share with rtx.bz." />
    <title>rtx.bz — Short links, simply.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="rtx.bz home">rtx<span>.</span>bz</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Change theme" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path />
        </svg>
      </button>
    </header>
    <main class="shortener">
      <header>
        <h1>Your link,<br />bite-sized</h1>
        <p class="intro">A link shortener by <a href="https://retrotho.com">RetroTho</a>.</p>
      </header>

      <form id="shorten-form" novalidate>
        <label for="url">Paste your long link</label>
        <div class="input-row">
          <input
            id="url"
            name="url"
            type="text"
            inputmode="url"
            autocomplete="url"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://example.com/something-long"
            aria-describedby="url-hint url-error"
            required
          />
          <button id="shorten-button" type="submit">Shorten link <span aria-hidden="true">↗</span></button>
        </div>
        <p class="hint" id="url-hint">Any http or https link will do.</p>
        <p class="error" id="url-error" role="alert" hidden></p>
      </form>

      <section class="result" id="result" aria-labelledby="result-label" hidden>
        <h2 id="result-label">Ready to share</h2>
        <div class="result-row">
          <input id="short-url" type="text" readonly aria-label="Your short link" />
          <button class="copy-button" id="copy-button" type="button">Copy link</button>
        </div>
      </section>
      <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript><p class="error">Enable JavaScript to shorten a link.</p></noscript>
    </main>
  </body>
</html>
